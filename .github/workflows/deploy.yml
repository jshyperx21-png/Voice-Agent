name: Deploy to Live Server

# This triggers the workflow only when a push happens on the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }} # <-- This tells GitHub how to unlock your SSH key
          script: |
            # 1. Navigate to your correct project directory on the server
            cd /home/vilgax/voiceaget/Voice-Agent
            
            # 2. Pull the newest changes from the main branch
            git pull origin main
            
            # 3. Rebuild and restart your Docker containers cleanly
            docker compose down
            docker compose up -d --build